blueprint:
  name: ZHA - IKEA Bilresa (Fix 2 Lights & Wheel)
  description: Działające sterowanie 2 światłami oraz jasnością/temperaturą w ZHA.
  domain: automation
  input:
    remote:
      name: Pilot IKEA Bilresa
      selector:
        device:
          integration: zha
    light_1:
      name: Światło 1
      selector:
        target:
          entity:
            domain: light
    light_2:
      name: Światło 2
      selector:
        target:
          entity:
            domain: light
    helper_active_light:
      name: Pomocnik wybranego światła
      description: Wybierz input_number.bilresa_wybrane_swiatlo
      selector:
        entity:
          domain: input_number
    helper_wheel_mode:
      name: Pomocnik trybu kółka
      description: Wybierz input_select.bilresa_tryb_kolka
      selector:
        entity:
          domain: input_select

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      cmd: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      active_light_entity: !input helper_active_light
      wheel_mode_entity: !input helper_wheel_mode
      active_num: "{{ states(active_light_entity) | int(1) }}"
      wheel_mode: "{{ states(wheel_mode_entity) }}"
      # Przypisujemy obiekty target z !input do zmiennych
      target_l1: !input light_1
      target_l2: !input light_2

  - choose:
      # --- 1. PRZYCISK ON (Włącz / Przełącz) ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['on', 'toggle'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ active_num == 1 }}"
                sequence:
                  - service: light.toggle
                    target: "{{ target_l1 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ active_num == 2 }}"
                sequence:
                  - service: light.toggle
                    target: "{{ target_l2 }}"

      # --- 2. PRZYCISK OFF (Wyłącz) ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['off'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ active_num == 1 }}"
                sequence:
                  - service: light.turn_off
                    target: "{{ target_l1 }}"
              - conditions:
                  - condition: template
                    value_template: "{{ active_num == 2 }}"
                sequence:
                  - service: light.turn_off
                    target: "{{ target_l2 }}"

      # --- 3. KÓŁKO (Move To Level) ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['move_to_level', 'move_to_level_with_on_off'] }}"
        sequence:
          - choose:
              # Tryb 1: JASNOŚĆ
              - conditions:
                  - condition: template
                    value_template: "{{ wheel_mode == 'jasnosc' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ active_num == 1 }}"
                        sequence:
                          - service: light.turn_on
                            target: "{{ target_l1 }}"
                            data:
                              brightness: "{{ args[0] }}"
                              transition: 0.1
                      - conditions:
                          - condition: template
                            value_template: "{{ active_num == 2 }}"
                        sequence:
                          - service: light.turn_on
                            target: "{{ target_l2 }}"
                            data:
                              brightness: "{{ args[0] }}"
                              transition: 0.1

              # Tryb 2: TEMPERATURA BARWY
              - conditions:
                  - condition: template
                    value_template: "{{ wheel_mode == 'temperatura' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ active_num == 1 }}"
                        sequence:
                          - service: light.turn_on
                            target: "{{ target_l1 }}"
                            data:
                              color_temp: "{{ ((args[0] / 255.0) * (500 - 153) + 153) | int }}"
                              transition: 0.1
                      - conditions:
                          - condition: template
                            value_template: "{{ active_num == 2 }}"
                        sequence:
                          - service: light.turn_on
                            target: "{{ target_l2 }}"
                            data:
                              color_temp: "{{ ((args[0] / 255.0) * (500 - 153) + 153) | int }}"
                              transition: 0.1
