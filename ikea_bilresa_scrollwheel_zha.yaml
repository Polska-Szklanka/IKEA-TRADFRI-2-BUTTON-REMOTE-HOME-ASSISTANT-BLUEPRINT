blueprint:
  name: ZHA - IKEA Bilresa (1 Lampa - Płynna Jasność)
  description: Proste sterowanie jedną lampą z płynniejszą regulacją jasności z kółka.
  domain: automation
  input:
    remote:
      name: Pilot IKEA Bilresa
      selector:
        device:
          integration: zha
    target_light:
      name: Lampa
      selector:
        target:
          entity:
            domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      cmd: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      target_l: !input target_light
      level_val: "{{ args[0] | int(0) if args else 0 }}"
      current_brightness: "{{ state_attr(target_l.entity_id, 'brightness') | int(0) }}"

  - choose:
      # --- 1. PRZYCISK ON ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['on', 'toggle'] }}"
        sequence:
          - service: light.toggle
            target: "{{ target_l }}"

      # --- 2. PRZYCISK OFF ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['off'] }}"
        sequence:
          - service: light.toggle
            target: "{{ target_l }}"

# --- 3. OBRÓT KÓŁKA (Ściemnianie / Rozjaśnianie względne) ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['step', 'brightness_step', 'move', 'brightness_move'] }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light_entity }}"
            data:
              brightness: >
                {% set current = state_attr(light_entity, 'brightness') | int(0) %}
                {# Sprawdzamy kierunek z argumentów pilota (up/down lub krok) #}
                {% set direction = args[0] if args is defined and args|length > 0 else 'up' %}
                {% set step_size = 25 %}
                {% if direction in [0, 'up', 'Increase'] or (args|length > 1 and args[0] == 0) %}
                  {{ [current + step_size, 255] | min }}
                {% else %}
                  {{ [current - step_size, 0] | max }}
                {% endif %}
              transition: 0.1
