blueprint:
  name: ZHA - IKEA Bilresa (1 Lampa - Płynna Jasność)
  description: Proste sterowanie jedną lampą z płynniejszą regulacją jasności z kółka.
  domain: automation
  input:
    remote:
      name: Pilot IKEA Bilresa
      selector:
        device:
          integration: zha
    target_light:
      name: Lampa
      selector:
        target:
          entity:
            domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      cmd: "{{ trigger.event.data.command }}"
      level: "{{ (trigger.event.data.params.level | default(1, true)) | int(1) }}"

  - choose:
      # Button press -> toggle (works regardless of the remote's own on/off state)
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['on', 'off', 'toggle'] }}"
        sequence:
          - action: light.toggle
            target: !input target_light

      # Dial rotation -> the remote sends an absolute level, so set it directly
      - conditions:
          - condition: template
            value_template: "{{ cmd == 'move_to_level' }}"
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness: "{{ [[level, 1] | max, 255] | min }}"
              transition: 0.3
