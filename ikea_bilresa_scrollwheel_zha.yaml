blueprint:
  name: ZHA - IKEA Bilresa (2 Światła i 2 Tryby Kółka)
  description: Sterowanie dwoma światłami oraz jasnością i temperaturą bez dolnego przycisku.
  domain: automation
  input:
    remote:
      name: Pilot IKEA Bilresa
      selector:
        device:
          integration: zha
    light_1:
      name: Światło 1
      selector:
        target:
          entity:
            domain: light
    light_2:
      name: Światło 2
      selector:
        target:
          entity:
            domain: light
    helper_active_light:
      name: Pomocnik wybranego światła
      description: Wybierz input_number.bilresa_wybrane_swiatlo
      selector:
        entity:
          domain: input_number
    helper_wheel_mode:
      name: Pomocnik trybu kółka
      description: Wybierz input_select.bilresa_tryb_kolka
      selector:
        entity:
          domain: input_select

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      remote_dev: !input remote
      cmd: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      active_light_entity: !input helper_active_light
      wheel_mode_entity: !input helper_wheel_mode
      active_num: "{{ states(active_light_entity) | int(1) }}"
      wheel_mode: "{{ states(wheel_mode_entity) }}"

  - choose:
      # --- PRZYCISK WYŁĄCZ (OFF) ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['off'] }}"
        sequence:
          - service: light.turn_off
            target:
              entity_id: >-
                {% if active_num == 1 %} !input light_1
                {% else %} !input light_2 {% endif %}

      # --- PRZYCISK WŁĄCZ (ON) - 1x / 2x / 3x klik ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['on', 'toggle'] }}"
        sequence:
          - wait_for_trigger:
              - platform: event
                event_type: zha_event
                event_data:
                  device_id: "{{ remote_dev }}"
                  command: "on"
            timeout:
              milliseconds: 400
          - choose:
              # 1x Klik -> Toggle
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger == none }}"
                sequence:
                  - service: light.toggle
                    target:
                      entity_id: >-
                        {% if active_num == 1 %} !input light_1
                        {% else %} !input light_2 {% endif %}

              # 2x lub 3x Klik
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger != none }}"
                sequence:
                  - wait_for_trigger:
                      - platform: event
                        event_type: zha_event
                        event_data:
                          device_id: "{{ remote_dev }}"
                          command: "on"
                    timeout:
                      milliseconds: 400
                  - choose:
                      # 2x Klik -> Zmiana trybu kółka (Jasność <-> Temperatura)
                      - conditions:
                          - condition: template
                            value_template: "{{ wait.trigger == none }}"
                        sequence:
                          - service: input_select.select_option
                            target:
                              entity_id: !input helper_wheel_mode
                            data:
                              option: "{{ 'temperatura' if wheel_mode == 'jasnosc' else 'jasnosc' }}"

                      # 3x Klik -> Przełączenie światła (1 <-> 2)
                      - conditions:
                          - condition: template
                            value_template: "{{ wait.trigger != none }}"
                        sequence:
                          - service: input_number.set_value
                            target:
                              entity_id: !input helper_active_light
                            data:
                              value: "{{ 2 if active_num == 1 else 1 }}"

      # --- TARCZA / KÓŁKO (Move To Level) ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['move_to_level', 'move_to_level_with_on_off'] }}"
        sequence:
          - choose:
              # Tryb Jasność
              - conditions:
                  - condition: template
                    value_template: "{{ wheel_mode == 'jasnosc' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: >-
                        {% if active_num == 1 %} !input light_1
                        {% else %} !input light_2 {% endif %}
                    data:
                      brightness: "{{ args[0] }}"
                      transition: 0.1

              # Tryb Temperatura
              - conditions:
                  - condition: template
                    value_template: "{{ wheel_mode == 'temperatura' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: >-
                        {% if active_num == 1 %} !input light_1
                        {% else %} !input light_2 {% endif %}
                    data:
                      color_temp: "{{ ((args[0] / 255.0) * (500 - 153) + 153) | int }}"
                      transition: 0.1
