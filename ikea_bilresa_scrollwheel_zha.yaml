blueprint:
  name: ZHA - IKEA Bilresa (1 Lampa - Płynna Jasność)
  description: Proste sterowanie jedną lampą z płynniejszą regulacją jasności z kółka.
  domain: automation
  input:
    remote:
      name: Pilot IKEA Bilresa
      selector:
        device:
          integration: zha
    target_light:
      name: Lampa
      selector:
        target:
          entity:
            domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      cmd: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      params: "{{ trigger.event.data.params | default({}, true) }}"
      going_down: >-
        {%- if params is mapping and params.step_mode is defined -%}
          {% set m = params.step_mode %}
        {%- elif params is mapping and params.move_mode is defined -%}
          {% set m = params.move_mode %}
        {%- elif args is sequence and args is not string and args | length > 0 -%}
          {% set m = args[0] %}
        {%- else -%}
          {% set m = 0 %}
        {%- endif -%}
        {{ m | string | lower in ['1', 'down', 'decrease'] }}

choose:
# --- 1. PRZYCISK ON ---
conditions:
condition: template
      value_template: "{{ cmd in ['on', 'toggle'] }}"
  sequence:
service: light.toggle
    target: "{{ target_l }}"

      # --- 2. PRZYCISK OFF ---
      
conditions:
condition: template
        value_template: "{{ cmd in ['off'] }}"
    sequence:
service: light.turn_off
      target: "{{ target_l }}"

      # Dial rotation -> relative brightness change
      - conditions:
          - condition: template
            value_template: >
              {{ cmd in ['step', 'step_with_on_off', 'move', 'move_with_on_off',
                         'brightness_step', 'brightness_move'] }}
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness_step: "{{ -25 if going_down else 25 }}"
              transition: 0.1
