blueprint:
  name: ZHA - IKEA Bilresa (1 Lampa - Płynna Jasność)
  description: Proste sterowanie jedną lampą z płynniejszą regulacją jasności z kółka.
  domain: automation
  input:
    remote:
      name: Pilot IKEA Bilresa
      selector:
        device:
          integration: zha
    target_light:
      name: Lampa
      selector:
        target:
          entity:
            domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      cmd: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      target_l: !input target_light
      level_val: "{{ args[0] | int(0) if args else 0 }}"
      current_brightness: "{{ state_attr(target_l.entity_id, 'brightness') | int(0) }}"

  - choose:
      # --- 1. PRZYCISK ON ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['on', 'toggle'] }}"
        sequence:
          - service: light.toggle
            target: "{{ target_l }}"

      # --- 2. PRZYCISK OFF ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['off'] }}"
        sequence:
          - service: light.turn_off
            target: "{{ target_l }}"

      # --- 3. OBRÓT KÓŁKA (Ściemnianie / Rozjaśnianie) ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['move_to_level', 'move_to_level_with_on_off'] }}"
        sequence:
          # Reaguj tylko, jeśli zmiana jest większa niż 5 jednostek (zapobiega gwałtownym skokom)
          - condition: template
            value_template: "{{ (level_val - current_brightness) | abs > 5 }}"
          - service: light.turn_on
            target: "{{ target_l }}"
            data:
              brightness: "{{ level_val }}"
              transition: 0.4
