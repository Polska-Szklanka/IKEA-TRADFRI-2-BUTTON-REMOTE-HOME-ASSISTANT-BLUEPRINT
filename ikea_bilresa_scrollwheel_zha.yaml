blueprint:
  name: ZHA - IKEA Bilresa (Reakcja bez skoków jasności)
  description: Szybka reakcja na przyciski oraz poprawna obsługa kółka po zmianie jasności z innych źródeł.
  domain: automation
  input:
    remote:
      name: Pilot IKEA Bilresa
      selector:
        device:
          integration: zha
    target_light:
      name: Lampa
      selector:
        target:
          entity:
            domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - choose:
      # --- 1. PRZYCISK ON / TOGGLE ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command in ['on', 'toggle'] }}"
        sequence:
          - action: light.toggle
            target: !input target_light

      # --- 2. PRZYCISK OFF ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command in ['off'] }}"
        sequence:
          - action: light.turn_off
            target: !input target_light

      # --- 3. OBRÓT KÓŁKA ---
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command in ['move_to_level', 'move_to_level_with_on_off'] }}"
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness: "{{ trigger.event.data.args[0] | int(0) if trigger.event.data.args else 0 }}"
              transition: 0.1
