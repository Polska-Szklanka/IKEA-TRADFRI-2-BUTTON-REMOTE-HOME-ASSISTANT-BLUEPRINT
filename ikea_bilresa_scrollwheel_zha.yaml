blueprint:
  name: ZHA - IKEA Bilresa (Reakcja bez skoków jasności)
  description: Szybka reakcja na przyciski oraz poprawna obsługa kółka po zmianie jasności z innych źródeł.
  domain: automation
  input:
    remote:
      name: Pilot IKEA Bilresa
      selector:
        device:
          integration: zha
    target_light:
      name: Lampa
      selector:
        target:
          entity:
            domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      cmd: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      # Pobieramy ID encji z selektora target
      target_entity: "{{ (input('target_light').entity_id if input('target_light').entity_id is defined else input('target_light')) }}"
      level_val: "{{ args[0] | int(0) if args else 0 }}"

  - choose:
      # --- 1. PRZYCISK ON / TOGGLE ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['on', 'toggle'] }}"
        sequence:
          - action: light.toggle
            target: !input target_light

      # --- 2. PRZYCISK OFF ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['off'] }}"
        sequence:
          - action: light.turn_off
            target: !input target_light

      # --- 3. OBRÓT KÓŁKA ---
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['move_to_level', 'move_to_level_with_on_off'] }}"
        sequence:
          - action: light.turn_on
            target: !input target_light
            data:
              brightness: "{{ level_val }}"
              transition: 0.1
